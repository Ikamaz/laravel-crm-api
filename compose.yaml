x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_UID: ${DOCKER_UID:-1000}
      APP_GID: ${DOCKER_GID:-1000}
  working_dir: /var/www/html
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - app_storage:/var/www/html/storage
    - app_bootstrap_cache:/var/www/html/bootstrap/cache
  environment: &app-environment
    APP_URL: http://localhost:8000
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-laravel_crm_api}
    DB_USERNAME: ${DOCKER_DB_USERNAME:-laravel_crm}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-local-dev-password}
    QUEUE_CONNECTION: database
    CACHE_STORE: file
    SESSION_DRIVER: file
    LOG_CHANNEL: stderr
    COMPOSER_HOME: /tmp/composer
    HOME: /tmp

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_crm_api}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-laravel_crm}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  setup:
    <<: *app
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        composer install --prefer-dist --no-interaction --no-progress
        if grep -q '^APP_KEY=$' .env; then
          php artisan key:generate --force
        fi
        php artisan migrate --force
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "${APP_FORWARD_PORT:-8000}:8000"
    restart: unless-stopped

  queue:
    <<: *app
    command:
      - php
      - artisan
      - queue:work
      - database
      - --sleep=3
      - --tries=3
      - --timeout=90
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *app
    command:
      - php
      - artisan
      - schedule:work
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
  vendor:
  app_storage:
  app_bootstrap_cache:
