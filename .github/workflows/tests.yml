name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }} (SQLite)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Check code style
        run: vendor/bin/pint --test

  docker-compose:
    name: Docker Compose configuration and image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build --pull app

  mysql-integration:
    name: MySQL 8 integration (PHP 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_crm_api
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_crm_api
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests against MySQL
        run: php artisan test

  docker-runtime-smoke:
    name: Docker Compose runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match container user to runner
        run: |
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start full Docker Compose stack
        run: docker compose up --detach --build

      - name: Verify API health and long-running services
        shell: bash
        run: |
          set -euo pipefail

          healthy=false
          for attempt in {1..60}; do
            if response="$(curl --fail --silent http://127.0.0.1:8000/api/v1/health)" \
              && jq -e '.data.status == "ok"' <<< "$response" >/dev/null; then
              echo "API health check passed: $response"
              healthy=true
              break
            fi

            sleep 2
          done

          if [[ "$healthy" != "true" ]]; then
            echo "The API did not become healthy within 120 seconds."
            docker compose ps --all
            docker compose logs --no-color
            exit 1
          fi

          running_services="$(docker compose ps --services --status running)"
          for service in mysql app queue scheduler; do
            if ! grep -Fxq "$service" <<< "$running_services"; then
              echo "Expected service '$service' is not running."
              docker compose ps --all
              docker compose logs --no-color "$service"
              exit 1
            fi
          done

          docker compose ps --all

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
